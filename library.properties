paragraph=This library provides comprehensive support for the ESP32-S3-POE-ETH-8DI-8DO board including digital I/O control (8DI+8DO with optocoupler isolation), RS485/CAN communication, Ethernet connectivity (W5500), RGB LED status indicators, and piezo buzzer control. Features TCA9554PWR I/O expander for relay outputs, PCF85063 RTC, and full LoRa DTU integration via RS485.

